<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#1E1B9E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Adoca - Local Experts. Direct Deals. Zero Commission.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">

    <title>Adoca</title>

    <!-- Cache-busted CSS -->
    <link rel="stylesheet" href="css/styles.css?v=12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <div class="q-app-frame">

        <!-- Top App Bar -->
        <header class="q-app-header">
            <button class="q-header-btn" onclick="app.navigate(null)">
                <i data-lucide="menu"></i>
            </button>
            <h1>Adoca</h1>
            <button class="q-header-btn" onclick="app.navigate(null, null, null, 'contact')">
                <i data-lucide="bell"></i>
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="app-container"></main>

        <!-- Bottom Navigation -->
        <nav class="q-app-nav">
            <div class="q-nav-item active" id="nav-home" onclick="app.navigate(null)">
                <i data-lucide="home"></i>
                <span>Home</span>
            </div>
            <div class="q-nav-item" id="nav-requests" onclick="app.navigate(null,null,null,'requests')">
                <i data-lucide="clipboard-list"></i>
                <span>Requests</span>
            </div>
            <div class="q-nav-item" id="nav-chat" onclick="app.navigate(null, null, null, 'chat')">
                <i data-lucide="message-circle"></i>
                <span>Chat</span>
            </div>
            <div class="q-nav-item" id="nav-profile" onclick="app.navigate(null, null, null, 'profile')">
                <i data-lucide="user"></i>
                <span>Profile</span>
            </div>
        </nav>

    </div>

    <!-- Toast Layer -->
    <div id="q-toast-container"></div>

    <!-- Cache-busted JS -->
    <script src="js/config.js?v=12"></script>
    <script src="js/utils.js?v=12"></script>
    <script src="js/submit-handler.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
</body>

</html>
